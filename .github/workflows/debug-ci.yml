name: Debug CI - Budget Module

on:
  push:
    branches: [ "feat/budget-module" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Aden"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Aden"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Runner Environment (Debug Safe)
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID || '1310377330875463' }}"
            echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN || 'debug_placeholder_token' }}"
          } > local.properties

          sed -i 's/\r$//' gradlew gradle.properties app/build.gradle.kts 2>/dev/null || true
          sed -i '/GRADLE_USER_HOME=F:/d' gradlew
          chmod +x gradlew
          rm -f gradle/gradle-daemon-jvm.properties

          # فصل توقيع release عن buildType debug مؤقتاً داخل بيئة CI فقط
          sed -i '/signingConfig = signingConfigs\.getByName("release")/d' app/build.gradle.kts

          # ضبط الذاكرة وتعطيل configuration-cache على CI لتجنب تعارضات مؤقتة
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^org\.gradle\.configuration-cache=/d' gradle.properties
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx1536m -Dfile.encoding=UTF-8\norg.gradle.configuration-cache=false\n" >> gradle.properties

      - name: Build Debug APK
        run: |
          set -o pipefail
          mkdir -p build_logs
          ./gradlew assembleDebug -x lint --max-workers=2 --stacktrace 2>&1 | tee build_logs/debug_build.log

      - name: Publish Failure Summary
        if: failure()
        run: |
          python3 - << 'PYEOF'
          import os, re

          log_path = "build_logs/debug_build.log"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          out = ["## ❌ ملخص أخطاء بناء Debug\n"]

          if os.path.exists(log_path):
              lines = open(log_path, encoding="utf-8", errors="ignore").read().splitlines()

              failed = [l.strip() for l in lines if l.startswith("> Task ") and "FAILED" in l]
              if failed:
                  out.append("### المهمة الفاشلة\n```text\n" + "\n".join(dict.fromkeys(failed)) + "\n```\n")

              what_wrong = []
              capture = False
              for l in lines:
                  if l.startswith("* What went wrong:"):
                      capture = True
                      what_wrong.append(l)
                      continue
                  if capture:
                      if l.startswith("* Try:") or l.startswith("* Exception is:") or l.startswith("BUILD FAILED"):
                          capture = False
                          continue
                      what_wrong.append(l)
              if what_wrong:
                  out.append("### سبب الفشل المباشر\n```text\n" + "\n".join(what_wrong[:40]) + "\n```\n")

              err_pat = re.compile(r"(\berror:|ERROR:|cannot find symbol|incompatible types|AAPT:|resource .* not found|failed linking|Duplicate|Caused by:)")
              errs = []
              for i, l in enumerate(lines):
                  s = l.strip()
                  if not s or s.startswith("at ") or s.startswith("... "):
                      continue
                  if err_pat.search(s):
                      errs.append(l)
                      for j in range(1, 4):
                          if i + j < len(lines):
                              nxt = lines[i + j]
                              if nxt.strip() and not nxt.strip().startswith("at ") and not nxt.strip().startswith("... "):
                                  errs.append(nxt)
                              else:
                                  break
              if errs:
                  out.append("### تفاصيل أخطاء الكود والموارد\n```text\n" + "\n".join(errs[:100]) + "\n```\n")

          text = "\n".join(out)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(text)
          print(text)
          PYEOF

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-v2-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
