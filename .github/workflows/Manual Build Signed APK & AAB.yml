name: Manual Build Signed APK & AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'اختر نوع الحزمة المراد بناؤها - apk أو aab أو both'
        required: true
        default: 'both'
        type: choice
        options:
          - apk
          - aab
          - both
      update_branch:
        description: 'تحديث ودمج فرع الإصدار عند وجوده مسبقاً (force push) - الافتراضي: معطّل'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: "Asia/Aden"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Aden"
      # بصمة مفتاح التحميل المعتمدة المستخرجة من Android Studio
      EXPECTED_UPLOAD_SHA256: "1C:36:97:38:51:F5:85:01:A8:EA:6C:94:15:51:1C:EC:7A:0F:AB:1A:F8:35:73:2A:65:81:BA:62:67:27:39:0D"

    steps:
      # 1. سحب ملفات المشروع من الفرع المحدد في قائمة GitHub المباشرة
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. إعداد بيئة Java 21
      - name: Set up JDK 21 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 3. الفحص الأول: فك تشفير المفتاح والتأكد من بصمته مباشرة عبر keytool (قبل sed)
      - name: Step 1 - Validate Keystore File Fingerprint (Pre-Sed)
        run: |
          set -e
          rm -rf build app/build build_logs aab_diagnostics_package "${{ github.workspace }}/app/release.jks"
          mkdir -p build_logs gradle/wrapper
          touch build_logs/build_full.log build_logs/error_summary.log

          echo "BUILD_FAILED=false" >> $GITHUB_ENV

          GRADLE_APP_FILE="app/build.gradle.kts"
          if [ ! -f "$GRADLE_APP_FILE" ] && [ -f "app/build.gradle" ]; then
            GRADLE_APP_FILE="app/build.gradle"
          fi
          echo "GRADLE_APP_FILE=${GRADLE_APP_FILE}" >> $GITHUB_ENV

          APP_VERSION=`grep -oP 'versionName\s*=?\s*["'\'']\K[^"'\'']+' "$GRADLE_APP_FILE" | head -n 1`
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$SELECTED_TYPE" ]; then
            SELECTED_TYPE="both"
          fi
          echo "SELECTED_TYPE=${SELECTED_TYPE}" >> $GITHUB_ENV

          echo "==================================================================" | tee -a build_logs/build_full.log
          echo "🔍 الفحص الأول: التحقق من ملف المفتاح المستخرج من KEYSTORE_BASE64" | tee -a build_logs/build_full.log
          echo "==================================================================" | tee -a build_logs/build_full.log

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "❌ خطأ حرج: أحد أسرار التوقيع الأربعة مفقود في GitHub Secrets!" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          KEYSTORE_PATH="${{ github.workspace }}/app/release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r\t' | base64 --decode > "$KEYSTORE_PATH"

          if ! CERT_INFO=`keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1`; then
            echo "❌ خطأ حرج: فشل فتح مفتاح التشفير! تأكد من كلمة المرور واسم الـ Alias." | tee -a build_logs/build_full.log
            echo "$CERT_INFO" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          ACTUAL_KEY_SHA256=`echo "$CERT_INFO" | grep -oP 'SHA256:\s*\K[0-9A-F:]+' | head -n 1`
          echo "🔹 البصمة الموجودة فعلياً داخل KEYSTORE_BASE64 : $ACTUAL_KEY_SHA256" | tee -a build_logs/build_full.log
          echo "🔹 البصمة المطلوبة لمفتاح التحميل (Upload Key) : $EXPECTED_UPLOAD_SHA256" | tee -a build_logs/build_full.log

          if [ "$ACTUAL_KEY_SHA256" != "$EXPECTED_UPLOAD_SHA256" ]; then
            echo "❌ خطأ حرج: البصمة داخل KEYSTORE_BASE64 ($ACTUAL_KEY_SHA256) غير مطابقة لبصمة مفتاح التحميل ($EXPECTED_UPLOAD_SHA256)!" | tee -a build_logs/build_full.log
            echo "⛔ تم إيقاف البناء فوراً قبل البدء!" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          echo "✅ الفحص الأول نجح: ملف المفتاح يطابق بصمة مفتاح التحميل 100%." | tee -a build_logs/build_full.log

      # 4. إعداد Android SDK وحقن المفتاح ومعرفات فيسبوك بأمر sed الآمن ثم الفحص الثاني عبر signingReport
      - name: Step 2 - Inject via sed & Verify Gradle Signing Fingerprint Before Build
        if: ${{ success() && env.BUILD_FAILED != 'true' }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FB_APP_ID_SECRET: ${{ secrets.FACEBOOK_APP_ID }}
          FB_CLIENT_TOKEN_SECRET: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          set -e
          cp -f "$GRADLE_APP_FILE" /tmp/original_build_gradle.bak

          ADEN_TIME=`date '+%Y-%m-%d %H:%M:%S %Z'`
          echo "ADEN_TIME=${ADEN_TIME}" >> $GITHUB_ENV

          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV

          # استخراج معرف وتوكن فيسبوك من GitHub Secrets (مع خيار احتياطي من strings.xml إن وجد)
          FB_APP_ID="$FB_APP_ID_SECRET"
          FB_CLIENT_TOKEN="$FB_CLIENT_TOKEN_SECRET"

          if [ -z "$FB_APP_ID" ] && [ -f "app/src/main/res/values/strings.xml" ]; then
            FB_APP_ID=`grep -oP 'name="facebook_app_id"[^>]*>\K[^<]+' app/src/main/res/values/strings.xml | head -n 1`
          fi
          if [ -z "$FB_CLIENT_TOKEN" ] && [ -f "app/src/main/res/values/strings.xml" ]; then
            FB_CLIENT_TOKEN=`grep -oP 'name="facebook_client_token"[^>]*>\K[^<]+' app/src/main/res/values/strings.xml | head -n 1`
          fi

          if [ -z "$FB_APP_ID" ] || [ -z "$FB_CLIENT_TOKEN" ]; then
            echo "❌ خطأ حرج: قيم FACEBOOK_APP_ID أو FACEBOOK_CLIENT_TOKEN مفقودة!" | tee -a build_logs/build_full.log
            echo "💡 أضف FACEBOOK_APP_ID و FACEBOOK_CLIENT_TOKEN في GitHub Secrets (انسخهما من ملف local.properties في الويندوز)." | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          # كتابة مسار SDK ومعرفات فيسبوك في local.properties المؤقت على خادم البناء دون التأثير على نسخة الويندوز
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "FACEBOOK_APP_ID=${FB_APP_ID}"
            echo "FACEBOOK_CLIENT_TOKEN=${FB_CLIENT_TOKEN}"
          } > local.properties
          echo "✅ تم حقن FACEBOOK_APP_ID و FACEBOOK_CLIENT_TOKEN في local.properties بنجاح." | tee -a build_logs/build_full.log

          SDKMANAGER=`find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" | sort -V | tail -n 1`
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          sed -i 's/\r$//' gradlew gradle.properties gradle/wrapper/gradle-wrapper.properties "$GRADLE_APP_FILE" app/proguard-rules.pro 2>/dev/null || true

          # 1) تحديث أسطر التوقيع الموجودة داخل signingConfigs في مكانها بدون حذف أي أقواس
          if grep -q '^\s*signingConfigs\s*{' "$GRADLE_APP_FILE"; then
            sed -i 's|keyAlias\s*=\s*keystoreProperties\["RELEASE_KEY_ALIAS"\].*|keyAlias = System.getenv("SIGNING_KEY_ALIAS")|g' "$GRADLE_APP_FILE"
            sed -i 's|keyPassword\s*=\s*keystoreProperties\["RELEASE_KEY_PASSWORD"\].*|keyPassword = System.getenv("SIGNING_KEY_PASSWORD")|g' "$GRADLE_APP_FILE"
            sed -i 's|storeFile\s*=\s*file("F:\\\\android\\\\key3\.jks")|storeFile = file(System.getenv("SIGNING_STORE_FILE") ?: "")|g' "$GRADLE_APP_FILE"
            sed -i 's|storeFile\s*=\s*file("D:\\\\android\\\\key3\.jks")|storeFile = file(System.getenv("SIGNING_STORE_FILE") ?: "")|g' "$GRADLE_APP_FILE"
            sed -i 's|storePassword\s*=\s*keystoreProperties\["RELEASE_STORE_PASSWORD"\].*|storePassword = System.getenv("SIGNING_STORE_PASSWORD")|g' "$GRADLE_APP_FILE"
          else
            echo '    signingConfigs {' > /tmp/signing_block.kts
            echo '        create("release") {' >> /tmp/signing_block.kts
            echo '            val envStoreFile = System.getenv("SIGNING_STORE_FILE")' >> /tmp/signing_block.kts
            echo '            storeFile = if (!envStoreFile.isNullOrEmpty()) file(envStoreFile) else null' >> /tmp/signing_block.kts
            echo '            storePassword = System.getenv("SIGNING_STORE_PASSWORD")' >> /tmp/signing_block.kts
            echo '            keyAlias = System.getenv("SIGNING_KEY_ALIAS")' >> /tmp/signing_block.kts
            echo '            keyPassword = System.getenv("SIGNING_KEY_PASSWORD")' >> /tmp/signing_block.kts
            echo '        }' >> /tmp/signing_block.kts
            echo '    }' >> /tmp/signing_block.kts
            sed -i '/^\s*buildTypes\s*{/e cat /tmp/signing_block.kts' "$GRADLE_APP_FILE"
            rm -f /tmp/signing_block.kts
          fi

          # 2) إزالة سطر التوقيع من داخل debug وإضافته داخل release تحت isShrinkResources = true
          sed -i '/signingConfigs\.getByName("debug")/d' "$GRADLE_APP_FILE"
          sed -i '/signingConfig\s*=\s*signingConfigs\.getByName("release")/d' "$GRADLE_APP_FILE"
          sed -i '/isShrinkResources\s*=\s*true/a \            signingConfig = signingConfigs.getByName("release")' "$GRADLE_APP_FILE"

          echo "==================================================================" | tee -a build_logs/build_full.log
          echo "📄 محتوى $GRADLE_APP_FILE بعد تنفيذ أوامر sed:" | tee -a build_logs/build_full.log
          echo "==================================================================" | tee -a build_logs/build_full.log
          grep -n -C 22 "buildTypes" "$GRADLE_APP_FILE" | tee -a build_logs/build_full.log
          echo "==================================================================" | tee -a build_logs/build_full.log

          sed -i '/GRADLE_USER_HOME=F:/d' gradlew
          chmod +x gradlew

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i '/^gradle\.user\.home=/d' gradle/wrapper/gradle-wrapper.properties
            sed -i '/^android\.sdk\.path=/d' gradle/wrapper/gradle-wrapper.properties
          fi

          rm -f gradle/gradle-daemon-jvm.properties

          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

          # ضبط الذاكرة والأداء لبيئة CI فقط دون أي خصائص deprecated في Gradle 9.5 / AGP 9.3.3
          printf "\n" >> gradle.properties
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^#.*org\.gradle\.parallel=/d' gradle.properties
          sed -i '/^org\.gradle\.parallel=/d' gradle.properties
          sed -i '/^org\.gradle\.workers\.max=/d' gradle.properties
          sed -i '/^org\.gradle\.caching=/d' gradle.properties
          sed -i '/^org\.gradle\.configuration-cache=/d' gradle.properties
          sed -i '/^#.*android\.enableR8\.fullMode=/d' gradle.properties
          sed -i '/^android\.enableR8\.fullMode=/d' gradle.properties
          sed -i '/^android\.r8\.optimizedResourceShrinking=/d' gradle.properties
          sed -i '/^android\.enableResourceOptimizations=/d' gradle.properties
          sed -i '/^android\.r8\.strictFullModeForKeepRules=/d' gradle.properties

          printf "\nandroid.r8.strictFullModeForKeepRules=true\norg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Aden\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.configuration-cache=false\norg.gradle.workers.max=2\n" >> gradle.properties

          echo "==================================================================" | tee -a build_logs/build_full.log
          echo "🔍 الفحص الثاني (بعد sed وقبل البناء): استخراج بصمة التوقيع الفعلية من Gradle عبر signingReport" | tee -a build_logs/build_full.log
          echo "==================================================================" | tee -a build_logs/build_full.log

          set +e
          ./gradlew :app:signingReport --max-workers=2 2>&1 | tee /tmp/signing_report.txt | tee -a build_logs/build_full.log
          REPORT_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $REPORT_EXIT -ne 0 ]; then
            echo "❌ فشل أمر signingReport بكود الخروج: $REPORT_EXIT" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          GRADLE_RELEASE_SHA256=`grep -A 12 "Variant: release" /tmp/signing_report.txt | grep -oP 'SHA-256:\s*\K[0-9A-F:]+' | head -n 1`
          rm -f /tmp/signing_report.txt

          echo "🔹 البصمة التي قرأها Gradle فعلياً لنسخة release : $GRADLE_RELEASE_SHA256" | tee -a build_logs/build_full.log
          echo "🔹 البصمة المطلوبة لمفتاح التحميل (Upload Key)  : $EXPECTED_UPLOAD_SHA256" | tee -a build_logs/build_full.log

          if [ "$GRADLE_RELEASE_SHA256" != "$EXPECTED_UPLOAD_SHA256" ]; then
            echo "❌ خطأ حرج بعد sed: البصمة التي قرأها Gradle لنسخة release ($GRADLE_RELEASE_SHA256) لا تطابق بصمة مفتاح التحميل ($EXPECTED_UPLOAD_SHA256)!" | tee -a build_logs/build_full.log
            echo "⛔ تم إيقاف البناء فوراً قبل البدء بأي تجميع!" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          echo "✅ الفحص الثاني نجح: Gradle مرتبط رسمياً بمفتاح التحميل الصحيح ($EXPECTED_UPLOAD_SHA256) وجاهز للبناء!" | tee -a build_logs/build_full.log
          ./gradlew clean --max-workers=2 --stacktrace 2>&1 | tee -a build_logs/build_full.log

      # 5. بناء نسخة APK وتأكيد مطابقتها لبصمة مفتاح التحميل
      - name: Build & Verify Signed Release APK
        if: ${{ success() && env.BUILD_FAILED != 'true' && (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both') }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          echo "=== بدء بناء نسخة Release APK ===" | tee -a build_logs/build_full.log
          ./gradlew assembleRelease \
            -x lint -x lintVitalRelease \
            -x uploadCrashlyticsMappingFileRelease \
            --max-workers=2 --stacktrace 2>&1 | tee -a build_logs/build_full.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          ./gradlew --stop 2>/dev/null || true

          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "ERROR: فشل بناء APK بكود الخروج: $GRADLE_EXIT" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 0
          fi

          APKSIGNER=`find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1`
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              echo "=== شهادة وبصمة ملف APK الناتج ===" | tee -a build_logs/build_full.log
              APK_CERT=`"$APKSIGNER" verify --print-certs "$apk" 2>&1`
              echo "$APK_CERT" | tee -a build_logs/build_full.log
              if ! echo "$APK_CERT" | grep -qi "1c36973851f58501a8ea6c9415511cec7a0fab1af835732a6581ba626727390d"; then
                echo "❌ خطأ حرج: بصمة ملف APK الناتج لا تطابق مفتاح التحميل!" | tee -a build_logs/build_full.log
                echo "BUILD_FAILED=true" >> $GITHUB_ENV
                exit 0
              fi
              echo "✅ تم التأكد القاطع من توقيع ملف APK ببصمة مفتاح التحميل الصحيحة!" | tee -a build_logs/build_full.log
            fi
          done
          exit 0

      # 6. بناء نسخة AAB وتوليد مجلدات mergeReleaseNativeLibs وتأكيد مطابقتها لبصمة مفتاح التحميل
      - name: Build & Verify Signed Release AAB & Native Debug Symbols
        if: ${{ success() && env.BUILD_FAILED != 'true' && (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both') }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          echo "=== الذاكرة المتاحة قبل بناء AAB ===" | tee -a build_logs/build_full.log
          free -h | tee -a build_logs/build_full.log
          echo "=== بدء بناء نسخة Release AAB وتوليد mergeReleaseNativeLibs ===" | tee -a build_logs/build_full.log
          ./gradlew bundleRelease mergeReleaseNativeLibs \
            -x lint -x lintVitalRelease \
            -x uploadCrashlyticsMappingFileRelease \
            --max-workers=2 --stacktrace 2>&1 | tee -a build_logs/build_full.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          ./gradlew --stop 2>/dev/null || true

          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "ERROR: فشل بناء AAB بكود الخروج: $GRADLE_EXIT" | tee -a build_logs/build_full.log
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            exit 0
          fi

          for aab in app/build/outputs/bundle/release/*.aab; do
            if [ -f "$aab" ]; then
              echo "=== فحص شهادة وبصمة ملف AAB النهائي ===" | tee -a build_logs/build_full.log
              AAB_CERT=`keytool -printcert -jarfile "$aab" 2>&1`
              echo "$AAB_CERT" | grep -E "Owner:|Issuer:|SHA1:|SHA256:" | tee -a build_logs/build_full.log

              if ! echo "$AAB_CERT" | grep -qi "$EXPECTED_UPLOAD_SHA256"; then
                echo "❌ خطأ حرج: بصمة ملف AAB الناتج لا تطابق بصمة مفتاح التحميل ($EXPECTED_UPLOAD_SHA256)!" | tee -a build_logs/build_full.log
                echo "BUILD_FAILED=true" >> $GITHUB_ENV
                exit 0
              fi

              echo "✅ تم التأكد القاطع من توقيع ملف AAB ببصمة مفتاح التحميل الصحيحة ($EXPECTED_UPLOAD_SHA256)!" | tee -a build_logs/build_full.log
            fi
          done
          exit 0

      # 7. استرجاع ملف build.gradle.kts الأصلي فوراً بعد انتهاء البناء
      - name: Restore Original build.gradle.kts
        if: always()
        run: |
          if [ -f /tmp/original_build_gradle.bak ]; then
            cp -f /tmp/original_build_gradle.bak "$GRADLE_APP_FILE"
            echo "تم استرجاع ملف $GRADLE_APP_FILE إلى حالته الأصلية بنجاح."
          fi

      # 8. فحص تشفير وتمويه وتفكيك DEX + استخراج r8.json لكل من APK و AAB ونشر الملخص
      - name: Inspect DEX Obfuscation, Breakdown & r8.json (APK & AAB)
        if: ${{ success() && env.BUILD_FAILED != 'true' }}
        run: |
          set +e
          TARGET_ARTIFACT=`ls app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1`
          if [ -z "$TARGET_ARTIFACT" ]; then
            echo "ℹ️ لم يُعثر على ملف AAB أو APK لفحص DEX." | tee -a build_logs/build_full.log
            exit 0
          fi

          mkdir -p build_logs/r8_artifacts/summaries
          python3 - "$TARGET_ARTIFACT" <<'PYEOF'
          import zipfile, glob, os, sys, json, struct, collections

          artifact_path = sys.argv[1]
          mapping_file = "app/build/outputs/mapping/release/mapping.txt"
          seeds_file = "app/build/outputs/mapping/release/seeds.txt"
          summary_dir = "build_logs/r8_artifacts/summaries"
          report_file = "build_logs/dex_obfuscation_report.txt"
          breakdown_file = f"{summary_dir}/dex_breakdown_report.txt"
          r8_json_summary_file = f"{summary_dir}/r8_json_summary.txt"

          def uleb128(buf, off):
              result = 0; shift = 0
              while True:
                  b = buf[off]; off += 1
                  result |= (b & 0x7f) << shift
                  if not (b & 0x80): break
                  shift += 7
              return result, off

          def pkg_bucket(cls_name):
              parts = cls_name.split(".")
              if len(parts) <= 1:
                  return "(default)"
              if parts[0] == "com" and len(parts) >= 4:
                  if parts[1] == "google" and parts[2] == "android" and parts[3] == "gms":
                      if len(parts) >= 6 and parts[4] == "internal":
                          return ".".join(parts[:6])
                      return ".".join(parts[:5]) if len(parts) >= 5 else ".".join(parts[:4])
                  if parts[1] == "google" and parts[2] in ("firebase", "api", "crypto", "common"):
                      return ".".join(parts[:4])
                  if parts[1] == "hpp" and parts[2] == "daftree":
                      return "com.hpp.daftree"
                  return ".".join(parts[:3])
              return ".".join(parts[:3]) if len(parts) >= 3 else ".".join(parts[:2])

          # 1) استخراج r8.json الرسمي من حزمة AAB إن وُجد
          r8_lines = []
          r8_json_data = None
          with zipfile.ZipFile(artifact_path, "r") as z:
              for name in z.namelist():
                  if name.endswith("r8.json"):
                      raw = z.read(name).decode("utf-8", errors="replace")
                      with open(f"{summary_dir}/r8.json", "w", encoding="utf-8") as rf:
                          rf.write(raw)
                      r8_lines.append(f"مصدر الملف: {artifact_path} -> {name}")
                      try:
                          r8_json_data = json.loads(raw)
                      except Exception as e:
                          r8_lines.append(f"تعذر تحليل JSON: {e}")
                      break

          if r8_json_data is not None:
              r8_lines.append(json.dumps(r8_json_data, indent=2, ensure_ascii=False))
          else:
              r8_lines.append("ملاحظة: ملف r8.json الرسمي يتولّد داخل حزمة AAB فقط (نوع البناء الحالي APK فقط).")

          with open(r8_json_summary_file, "w", encoding="utf-8") as out:
              out.write("\n".join(r8_lines) + "\n")

          # 2) فحص حجم وتمويه DEX
          lines = []
          def log(msg=""):
              print(msg)
              lines.append(msg)

          log("==================================================================")
          log("   تقرير فحص تشفير وتمويه DEX - Google Play DEX Check")
          log("==================================================================")
          log(f"ملف الحزمة المفحوص : {artifact_path}")
          total_dex_uncompressed = 0
          dex_count = 0
          dex_blobs = []
          with zipfile.ZipFile(artifact_path, "r") as z:
              for info in z.infolist():
                  if info.filename.endswith(".dex"):
                      dex_count += 1
                      total_dex_uncompressed += info.file_size
                      dex_blobs.append((info.filename, z.read(info.filename)))
                      log(f" - {info.filename}: {info.file_size / (1024*1024):.2f} MB")
          log(f"إجمالي عدد ملفات DEX : {dex_count}")
          log(f"إجمالي حجم DEX غير المضغوط : {total_dex_uncompressed / (1024 * 1024):.2f} MB")

          obf_to_orig = {}
          kept_pkg_counter = collections.Counter()
          orig_pkg_classes = collections.Counter()

          if os.path.exists(mapping_file):
              total_classes = obf_classes = repackaged_classes = total_methods = obf_methods = total_fields = obf_fields = 0
              with open(mapping_file, "r", encoding="utf-8", errors="ignore") as f:
                  for raw_line in f:
                      line = raw_line.rstrip("\r\n")
                      if not line or line.startswith("#"): continue
                      if not line[0].isspace() and " -> " in line and line.endswith(":"):
                          parts = line[:-1].split(" -> ")
                          if len(parts) == 2:
                              orig_cls, obf_cls = parts[0].strip(), parts[1].strip()
                              obf_to_orig.setdefault(obf_cls, orig_cls)
                              orig_pkg_classes[pkg_bucket(orig_cls)] += 1
                              total_classes += 1
                              if orig_cls != obf_cls:
                                  obf_classes += 1
                                  if obf_cls.startswith("c.h.d."): repackaged_classes += 1
                              else:
                                  kept_pkg_counter[pkg_bucket(orig_cls)] += 1
                      elif line[0].isspace() and " -> " in line:
                          left, obf_name = line.strip().split(" -> ", 1)
                          obf_name = obf_name.strip()
                          if "(" in left and ")" in left:
                              before_paren = left.split("(", 1)[0].strip()
                              orig_name = before_paren.split()[-1] if " " in before_paren else before_paren
                              if orig_name not in ("<init>", "<clinit>"):
                                  total_methods += 1
                                  if orig_name != obf_name: obf_methods += 1
                          else:
                              tokens = left.split()
                              if len(tokens) >= 2:
                                  total_fields += 1
                                  if tokens[-1] != obf_name: obf_fields += 1

              cls_pct = (obf_classes / total_classes * 100) if total_classes else 0
              mtd_pct = (obf_methods / total_methods * 100) if total_methods else 0
              fld_pct = (obf_fields / total_fields * 100) if total_fields else 0
              total_items = total_classes + total_methods + total_fields
              overall_pct = ((obf_classes + obf_methods + obf_fields) / total_items * 100) if total_items else 0

              log("------------------------------------------------------------------")
              log(f"الكلاسات المموهة Classes  : {obf_classes} / {total_classes} - {cls_pct:.2f}%")
              log(f"الكلاسات المدمجة في c.h.d : {repackaged_classes}")
              log(f"الدوال المموهة Methods    : {obf_methods} / {total_methods} - {mtd_pct:.2f}%")
              log(f"الحقول المموهة Fields     : {obf_fields} / {total_fields} - {fld_pct:.2f}%")
              log("------------------------------------------------------------------")
              log(f"النسبة الإجمالية لتمويه DEX : {overall_pct:.2f}% - الحد الأدنى المطلوب: 25%")

          if os.path.exists(seeds_file):
              log(f"حجم ملف seeds.txt : {os.path.getsize(seeds_file)/(1024*1024):.2f} MB")
          log("==================================================================")

          report_text = "\n".join(lines) + "\n"
          with open(report_file, "w", encoding="utf-8") as out:
              out.write(report_text)
          with open(f"{summary_dir}/dex_obfuscation_report.txt", "w", encoding="utf-8") as out:
              out.write(report_text)

          # 3) تفكيك حجم البايت-كود حسب الحزمة الأصلية (أثقل 20 حزمة)
          pkg_code_bytes = collections.Counter()
          pkg_dex_classes = collections.Counter()
          pkg_dex_methods = collections.Counter()
          total_code_bytes = 0

          for dex_name, d in dex_blobs:
              try:
                  s_size, s_off = struct.unpack_from("<II", d, 56)
                  t_size, t_off = struct.unpack_from("<II", d, 64)
                  c_size, c_off = struct.unpack_from("<II", d, 96)
                  strings_cache = {}
                  def get_str(idx):
                      if idx in strings_cache: return strings_cache[idx]
                      off = struct.unpack_from("<I", d, s_off + 4 * idx)[0]
                      _, off = uleb128(d, off)
                      end = d.index(b"\x00", off)
                      s = d[off:end].decode("utf-8", errors="replace")
                      strings_cache[idx] = s
                      return s
                  for i in range(c_size):
                      base = c_off + 32 * i
                      cls_idx, _, _, _, _, _, class_data_off, _ = struct.unpack_from("<8I", d, base)
                      sidx = struct.unpack_from("<I", d, t_off + 4 * cls_idx)[0]
                      desc = get_str(sidx)
                      obf_name = desc[1:-1].replace("/", ".") if desc.startswith("L") and desc.endswith(";") else desc
                      orig_name = obf_to_orig.get(obf_name, obf_name)
                      bucket = pkg_bucket(orig_name)
                      pkg_dex_classes[bucket] += 1
                      if class_data_off:
                          off = class_data_off
                          sf, off = uleb128(d, off)
                          inf, off = uleb128(d, off)
                          dm, off = uleb128(d, off)
                          vm, off = uleb128(d, off)
                          for _ in range(sf + inf):
                              _, off = uleb128(d, off)
                              _, off = uleb128(d, off)
                          for count in (dm, vm):
                              for _ in range(count):
                                  _, off = uleb128(d, off)
                                  _, off = uleb128(d, off)
                                  code_off, off = uleb128(d, off)
                                  pkg_dex_methods[bucket] += 1
                                  if code_off:
                                      insns_size = struct.unpack_from("<I", d, code_off + 12)[0]
                                      b_len = 16 + insns_size * 2
                                      pkg_code_bytes[bucket] += b_len
                                      total_code_bytes += b_len
              except Exception as ex:
                  print(f"DEX parse warning ({dex_name}): {ex}")

          blines = [
              "==================================================================",
              "  أثقل 20 مكتبة/حزمة داخل DEX (مرتبة حسب الحجم المقدر)",
              "==================================================================",
              f"{'Package':<45} {'Est.MB':>7} {'Share':>6} {'Classes':>8} {'Methods':>8}",
              "-" * 78,
          ]
          total_dex_mb = total_dex_uncompressed / (1024 * 1024)
          for pkg, cbytes in pkg_code_bytes.most_common(20):
              share = (cbytes / total_code_bytes) if total_code_bytes else 0
              est_mb = share * total_dex_mb
              blines.append(f"{pkg:<45} {est_mb:7.2f} {share*100:5.1f}% {pkg_dex_classes[pkg]:8d} {pkg_dex_methods[pkg]:8d}")

          blines.append("\n==================================================================")
          blines.append("  أكبر 15 حزمة غير مموهة (Kept Un-obfuscated)")
          blines.append("==================================================================")
          for pkg, cnt in kept_pkg_counter.most_common(15):
              tot = orig_pkg_classes[pkg]
              blines.append(f" - {pkg:<48} : {cnt:5d} kept / {tot:5d} total")

          breakdown_text = "\n".join(blines) + "\n"
          with open(breakdown_file, "w", encoding="utf-8") as out:
              out.write(breakdown_text)

          # نشر الملخص في صفحة GitHub Actions Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(f"# 📦 ملخص بناء الإصدار v{os.environ.get('APP_VERSION', '')}\n\n")
                  sf.write("## تقرير DEX والتمويه\n\n```\n" + report_text + "```\n\n")
                  if r8_json_data is not None and "stats" in r8_json_data:
                      sf.write("## نسب R8 الرسمية من r8.json\n\n```json\n" + json.dumps(r8_json_data["stats"], indent=2) + "\n```\n\n")
                  sf.write("## تفكيك حجم DEX\n\n```\n" + breakdown_text + "```\n")
          PYEOF
          exit 0

      # 9. تجهيز أقسام R8 المنفصلة + ضغط مجلدات التصحيح وجمع سجلات التشخيص
      - name: Package Merged Native Libs & Organize Separated R8 Artifacts
        if: always()
        run: |
          mkdir -p build_logs aab_diagnostics_package/logs \
            build_logs/r8_artifacts/summaries \
            build_logs/r8_artifacts/rules \
            build_logs/r8_artifacts/mapping \
            build_logs/r8_artifacts/reports
          touch build_logs/build_full.log

          {
            echo "===================================================="
            echo "ملخص الأخطاء والاستثناءات Error Summary"
            echo "===================================================="
            grep -i -E "FAILURE:|What went wrong:|Execution failed|Exception|Error:|Caused by:|Missing classes|Failed to|cannot find symbol|error:|exit code|خطأ|تم إيقاف" -C 15 build_logs/build_full.log || true
            echo "===================================================="
            echo "آخر 200 سطر من سجل البناء الكامل:"
            echo "===================================================="
            tail -n 200 build_logs/build_full.log
          } > build_logs/error_summary.log

          TARGET_NATIVE_PATH="app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
          if [ -d "$TARGET_NATIVE_PATH" ]; then
            cd "$TARGET_NATIVE_PATH"
            zip -r "${{ github.workspace }}/build_logs/native-debug-symbols-${APP_VERSION}.zip" . || true
            cd "${{ github.workspace }}"
            mkdir -p aab_diagnostics_package/merged_native_libs
            cp -r "$TARGET_NATIVE_PATH"/* aab_diagnostics_package/merged_native_libs/ 2>/dev/null || true
          else
            for alt_path in app/build/intermediates/merged_native_libs/release/*/out/lib; do
              if [ -d "$alt_path" ]; then
                cd "$alt_path"
                zip -r "${{ github.workspace }}/build_logs/native-debug-symbols-${APP_VERSION}.zip" . || true
                cd "${{ github.workspace }}"
                mkdir -p aab_diagnostics_package/merged_native_libs
                cp -r "$alt_path"/* aab_diagnostics_package/merged_native_libs/ 2>/dev/null || true
                break
              fi
            done
          fi

          # تقسيم مخرجات R8 إلى مجلدات منفصلة للرفع كـ Artifacts مستقلة
          if [ -d "app/build/outputs/mapping/release" ]; then
            cp -r app/build/outputs/mapping/release aab_diagnostics_package/r8_mapping_and_seeds
            for f in seeds.txt usage.txt configuration.txt resources.txt; do
              if [ -f "app/build/outputs/mapping/release/$f" ]; then
                cp -f "app/build/outputs/mapping/release/$f" build_logs/r8_artifacts/rules/
              fi
            done
            if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
              cp -f app/build/outputs/mapping/release/mapping.txt build_logs/r8_artifacts/mapping/
            fi
          fi

          if [ -d "app/build/outputs/native-debug-symbols/release" ]; then
            cp -r app/build/outputs/native-debug-symbols/release aab_diagnostics_package/native_debug_symbols
          fi

          if [ -d "app/build/reports" ]; then
            cp -r app/build/reports aab_diagnostics_package/app_error_reports
            cp -r app/build/reports/* build_logs/r8_artifacts/reports/ 2>/dev/null || true
          fi

          if [ -d "build/reports" ]; then
            cp -r build/reports aab_diagnostics_package/root_error_reports
          fi

          cp -f build_logs/*.log build_logs/*.txt aab_diagnostics_package/logs/ 2>/dev/null || true
          zip -r "build_logs/my-smart-wallet-aab-diagnostics-${APP_VERSION}-${{ github.run_number }}.zip" aab_diagnostics_package/ || true

      # 9-ب. عند حدوث خطأ في البناء: تلخيص وتجميل الأخطاء والتحذيرات في Job Summary (مع إزالة ضجيج stacktrace)
      - name: Publish Clean Error & Warning Summary to Job Summary
        if: ${{ failure() || env.BUILD_FAILED == 'true' }}
        run: |
          set +e
          python3 - << 'PYEOF'
          import os, re

          log_path = "build_logs/build_full.log"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          ver = os.environ.get("APP_VERSION", "unknown")
          btype = os.environ.get("SELECTED_TYPE", "both")

          out = [f"# ❌ ملخص فشل البناء — الإصدار v{ver} ({btype})\n"]

          if not os.path.exists(log_path) or os.path.getsize(log_path) == 0:
              out.append("⚠️ لم يتوفر سجل داخل `build_logs/build_full.log` (ربما فشل البناء في خطوة تهيئة مبكرة).")
          else:
              lines = open(log_path, encoding="utf-8", errors="ignore").read().splitlines()

              # 1) المهام التي فشلت
              failed_tasks = [l.strip() for l in lines if l.startswith("> Task ") and l.endswith("FAILED")]
              if failed_tasks:
                  out.append("## 🎯 المهمة التي فشلت\n```text\n" + "\n".join(dict.fromkeys(failed_tasks)) + "\n```\n")

              # 2) استخراج كتلة What went wrong صافية بدون سطور stacktrace
              what_wrong = []
              capture = False
              for l in lines:
                  if l.startswith("* What went wrong:"):
                      capture = True
                      what_wrong.append(l)
                      continue
                  if capture:
                      if l.startswith("* Try:") or l.startswith("* Exception is:") or l.startswith("BUILD FAILED"):
                          capture = False
                          continue
                      what_wrong.append(l)
              if what_wrong:
                  out.append("## 🔎 سبب الفشل المباشر (What went wrong)\n```text\n" + "\n".join(what_wrong[:40]) + "\n```\n")

              # 3) أخطاء المترجم / R8 / التوقيع (بدون تكرار وبعيداً عن سطور at ...)
              err_pat = re.compile(r"(error:|ERROR:|❌|cannot find symbol|Missing classes|Duplicate class|Execution failed for task|Caused by:|FAILURE:)")
              errors = []
              seen_err = set()
              for i, l in enumerate(lines):
                  s = l.strip()
                  if not s or s.startswith("at ") or s.startswith("... "):
                      continue
                  if err_pat.search(s) and s not in seen_err:
                      seen_err.add(s)
                      errors.append(s)
                      # إرفاق السطر التالي إذا كان يوضّح موضع الخطأ في الكود (مثل ^)
                      if i + 1 < len(lines) and ("^" in lines[i + 1] or lines[i + 1].strip().startswith("symbol:")):
                          errors.append(lines[i + 1].rstrip())
              if errors:
                  out.append("## 🚨 تفاصيل الأخطاء المستخرجة\n```text\n" + "\n".join(errors[:40]) + "\n```\n")

              # 4) تجميع التحذيرات المهمة بدون تكرار
              warn_pat = re.compile(r"(warning:|WARNING:|⚠️|Multiple substitutions|deprecated API|unchecked or unsafe|Missing class)")
              warnings = []
              seen_warn = set()
              for l in lines:
                  s = l.strip()
                  if not s or s.startswith("at "):
                      continue
                  if warn_pat.search(s) and s not in seen_warn:
                      seen_warn.add(s)
                      warnings.append(s)
              if warnings:
                  out.append(f"## ⚠️ أبرز التحذيرات ({len(warnings)})\n```text\n" + "\n".join(warnings[:25]) + "\n```\n")

              # 5) آخر 20 سطر مطوية كاحتياط
              out.append("<details>\n<summary>📄 عرض آخر 20 سطر من سجل البناء (احتياطي)</summary>\n\n```text\n" + "\n".join(lines[-20:]) + "\n```\n</details>\n")

          text = "\n".join(out) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(text)
          print(text[:3000])
          PYEOF

      # 10. في حال حدوث أي خطأ في المفتاح أو البناء: رفع سجلات الأخطاء فوراً إلى Artifacts
      - name: Upload Error Logs on Failure
        if: ${{ env.BUILD_FAILED == 'true' || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: my-smart-wallet-${{ env.SELECTED_TYPE }}-errors-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            build_logs/error_summary.log
            build_logs/build_full.log
            build_logs/my-smart-wallet-aab-diagnostics-${{ env.APP_VERSION }}-${{ github.run_number }}.zip
            app/build/outputs/mapping/release/*
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      # 11. إيقاف الوركفلو رسمياً بعد التأكد من رفع ملفات اللوج في حال فشل المفتاح أو البناء
      - name: Fail Job After Uploading Logs
        if: ${{ env.BUILD_FAILED == 'true' }}
        run: |
          echo "⛔ تم إيقاف الوركفلو بسبب عدم تطابق بصمة مفتاح التحميل أو فشل البناء. راجع الملخص أو error_summary.log."
          exit 1

      # 12. رفع حزمة APK (تظل كما هي تماماً بدون أي إضافات)
      - name: Upload Release APK Artifact
        if: ${{ success() && (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: my-smart-wallet-apk-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            build_logs/build_full.log
          if-no-files-found: ignore
          retention-days: 14

      # 13. رفع حزمة AAB (تظل كما هي تماماً بدون أي إضافات)
      - name: Upload Release AAB & Diagnostics Artifact
        if: ${{ success() && (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: my-smart-wallet-aab-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            build_logs/native-debug-symbols-${{ env.APP_VERSION }}.zip
            build_logs/dex_obfuscation_report.txt
            build_logs/build_full.log
          if-no-files-found: ignore
          retention-days: 14

      # 13-أ. مرفق مستقل 1: تقارير DEX و r8.json وتفكيك الحزم (أحجام صغيرة جداً)
      - name: Upload Separated Artifact 1 - DEX & R8 Summaries
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: 01-dex-and-r8-summaries-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: build_logs/r8_artifacts/summaries/**
          compression-level: 9
          if-no-files-found: ignore
          retention-days: 14

      # 13-ب. مرفق مستقل 2: ملفات seeds و usage و configuration و resources
      - name: Upload Separated Artifact 2 - R8 Seeds, Usage & Config
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: 02-r8-seeds-usage-config-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: build_logs/r8_artifacts/rules/**
          compression-level: 9
          if-no-files-found: ignore
          retention-days: 14

      # 13-ج. مرفق مستقل 3: ملف mapping.txt مضغوط لوحده
      - name: Upload Separated Artifact 3 - R8 Mapping Only
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: 03-r8-mapping-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: build_logs/r8_artifacts/mapping/mapping.txt
          compression-level: 9
          if-no-files-found: ignore
          retention-days: 14

      # 13-د. مرفق مستقل 4: تقارير البناء إن وجدت
      - name: Upload Separated Artifact 4 - App Reports
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: 04-app-reports-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: build_logs/r8_artifacts/reports/**
          compression-level: 9
          if-no-files-found: ignore
          retention-days: 14

      # 14. فحص وإنشاء أو تحديث فرع الإصدار بتوقيت عدن مع استرجاع كافة ملفات المستودع لحالتها الأصلية قبل الحفظ
      - name: Create or Update Version Branch
        if: ${{ success() && github.event.inputs.update_branch == 'true' }}
        run: |
          set -e
          mkdir -p /tmp/new_release_files

          DIAG_ZIP="build_logs/my-smart-wallet-aab-diagnostics-${APP_VERSION}-${{ github.run_number }}.zip"
          if [ -f "$DIAG_ZIP" ]; then
            mkdir -p /tmp/diagnostics_extracted
            unzip -o "$DIAG_ZIP" -d /tmp/diagnostics_extracted > /dev/null 2>&1 || true
            if [ -d "/tmp/diagnostics_extracted/aab_diagnostics_package" ]; then
              cp -rf /tmp/diagnostics_extracted/aab_diagnostics_package/* /tmp/new_release_files/ 2>/dev/null || true
              echo "📦 تم استخراج مكونات ملف التشخيص وإضافتها إلى ملفات فرع الإصدار."
            fi
          fi

          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              cp -f "$f" /tmp/new_release_files/
            fi
          done

          for f in app/build/outputs/bundle/release/*.aab; do
            if [ -f "$f" ]; then
              cp -f "$f" "/tmp/new_release_files/MySmartWallet-v${APP_VERSION}.aab"
            fi
          done

          if [ -f "build_logs/native-debug-symbols-${APP_VERSION}.zip" ]; then
            cp -f "build_logs/native-debug-symbols-${APP_VERSION}.zip" "/tmp/new_release_files/native-debug-symbols-${APP_VERSION}.zip"
          fi

          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp -f app/build/outputs/mapping/release/mapping.txt /tmp/new_release_files/mapping.txt
          fi

          if [ -f "build_logs/dex_obfuscation_report.txt" ]; then
            cp -f build_logs/dex_obfuscation_report.txt /tmp/new_release_files/dex_obfuscation_report.txt
          fi

          rm -f "${{ github.workspace }}/app/release.jks" local.properties
          rm -rf build app/build build_logs aab_diagnostics_package /tmp/diagnostics_extracted

          cp -f /tmp/original_build_gradle.bak "$GRADLE_APP_FILE" 2>/dev/null || true
          git checkout -- gradlew gradle/wrapper/gradle-wrapper.properties gradle.properties "$GRADLE_APP_FILE" app/proguard-rules.pro 2>/dev/null || true
          rm -f gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          git checkout -- gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

          git config user.name "Eng. Salah Build Bot"
          git config user.email "salah22ad@users.noreply.github.com"

          mkdir -p release_builds

          if git ls-remote --exit-code --heads origin "${APP_VERSION}" >/dev/null 2>&1; then
            git fetch origin "${APP_VERSION}"
            git checkout "origin/${APP_VERSION}" -- release_builds 2>/dev/null || true
          fi

          for f in /tmp/new_release_files/*.apk; do
            if [ -f "$f" ]; then
              rm -f release_builds/*.apk
            fi
          done

          for f in /tmp/new_release_files/*.aab; do
            if [ -f "$f" ]; then
              rm -f release_builds/*.aab
            fi
          done

          cp -rf /tmp/new_release_files/. release_builds/ 2>/dev/null || true

          export TZ="Asia/Aden"
          ADEN_COMMIT_TIME=`date '+%Y-%m-%d %I:%M:%S %p'`
          ADEN_ISO_DATE=`date '+%Y-%m-%dT%H:%M:%S+03:00'`
          export GIT_AUTHOR_DATE="${ADEN_ISO_DATE}"
          export GIT_COMMITTER_DATE="${ADEN_ISO_DATE}"

          git add -A
          git add -f release_builds/*

          git commit -m "Release v${APP_VERSION} [${SELECTED_TYPE}] - ${ADEN_COMMIT_TIME} Aden Time - Run #${{ github.run_number }}" || echo "No changes to commit"
          git push origin "HEAD:refs/heads/${APP_VERSION}" --force

      # 14-ب. إعلام عند تخطي قسم تحديث الفرع
      - name: Skip Version Branch Update (update_branch = false)
        if: ${{ success() && github.event.inputs.update_branch != 'true' }}
        run: |
          echo "ℹ️ تم تخطي قسم إنشاء/تحديث فرع الإصدار لأن خيار update_branch غير مفعّل."

      # 15. مسح ملف المفتاح المؤقت والنسخ الاحتياطية من الخادم بعد انتهاء العملية للأمان
      - name: Clean Up Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/app/release.jks" local.properties /tmp/new_release_files/* /tmp/original_build_gradle.bak 2>/dev/null || true

      # ✅ حذف بيئة العمل بالكامل بعد الانتهاء لضمان الأمان
      - name: Delete Workspace Environment
        if: always()
        run: |
          echo "🧹 جاري مسح بيئة العمل..."
          rm -rf ${{ github.workspace }}/* || true
          rm -rf ${{ github.workspace }}/.* || true
